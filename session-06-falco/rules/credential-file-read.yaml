# Falco custom rule — detect a container reading a credential/secret file.
# Tuned version: precise paths (no "contains shadow" over-match), covers the
# bind-mount variant, ATT&CK-mapped. Load via /etc/falco/rules.d/.
#
# A/B tested:
#   cat /host-etc/shadow            -> FIRES (real cred file, endswith /shadow)
#   cat /app/shadow-config.json     -> SILENT (lookalike, correctly ignored)

- list: credential_files
  items: ["/etc/shadow", "/etc/gshadow", "/etc/sudoers", "/root/.ssh/id_rsa"]

- rule: Container Read Credential File
  desc: A process inside a container read a credential/secret file - possible credential theft
  condition: >
    open_read and container
    and (fd.name in (credential_files) or fd.name endswith "/shadow")
  output: >
    Credential file read inside container
    (user=%user.name command=%proc.cmdline file=%fd.name
     container=%container.id image=%container.image.repository)
  priority: CRITICAL
  tags: [container, credential_access, T1552.001]
